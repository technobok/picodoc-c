<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
</head>
<body>
<h2 id="pipe-delimited-table">Pipe-Delimited Table</h2>
<table>
<thead>
<tr><th style="text-align: left">Name</th><th style="text-align: left">Age</th><th style="text-align: left">Status</th></tr>
</thead>
<tbody>
<tr><td>Alice</td><td>30</td><td>Active</td></tr>
<tr><td>Bob</td><td>25</td><td>Inactive</td></tr>
</tbody>
</table>
<h2 id="explicit-table-form">Explicit Table Form</h2>
<table>
<thead>
<tr><th style="text-align: left">Name</th><th style="text-align: left">Age</th></tr>
</thead>
<tbody>
<tr><td>Alice</td><td>30</td></tr>
<tr><td>Bob</td><td>25</td></tr>
</tbody>
</table>
<h2 id="table-with-inline-macros">Table with Inline Macros</h2>
<table>
<thead>
<tr><th style="text-align: left">Feature</th><th style="text-align: left">Supported</th></tr>
</thead>
<tbody>
<tr><td>Bold</td><td><strong>Yes</strong></td></tr>
<tr><td>Links</td><td><a href="https://example.com">Yes</a></td></tr>
</tbody>
</table>
<h2 id="table-cell-with-colspan">Table Cell with Colspan</h2>
<table>
<thead>
<tr><th style="text-align: left">Name</th><th style="text-align: left">Age</th></tr>
</thead>
<tbody>
<tr><td>Alice</td><td>30</td></tr>
<tr><td colspan="2">Total: 1 person</td></tr>
</tbody>
</table>
</body>
</html>
